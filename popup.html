<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade Counter Timer</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="themes.css" />
  </head>
  <body>
    <div id="screen" class="screen" inert>
      <div class="material-hardware" aria-hidden="true">
        <i class="case-screw case-screw--tl"></i><i class="case-screw case-screw--tr"></i>
        <i class="case-screw case-screw--bl"></i><i class="case-screw case-screw--br"></i>
        <svg class="deco-fan" viewBox="0 0 100 54" focusable="false"><defs><linearGradient id="fan-gold"><stop stop-color="#74531c"/><stop offset=".3" stop-color="#f9e5a7"/><stop offset=".5" stop-color="#b29148"/><stop offset=".7" stop-color="#fff0bd"/><stop offset="1" stop-color="#7e602c"/></linearGradient></defs><path d="M3 50 12 25 23 36 29 11 40 24 50 1 60 24 71 11 77 36 88 25 97 50Z" fill="url(#fan-gold)" stroke="#dfc284"/><path d="m50 50-38-25m38 25L29 11m21 39V1m0 49 21-39M50 50l38-25" stroke="#523b17" stroke-width="1.5"/><path d="M2 51h96M14 53h72" stroke="#e8d29a"/></svg>
        <svg class="deco-inlay" viewBox="0 0 600 520" preserveAspectRatio="none" focusable="false"><path id="left-inlay" d="M12 94 25 108 25 141 19 132 19 302 25 312 25 417 12 430Z" fill="url(#fan-gold)" stroke="#e7ce8b"/><use href="#left-inlay" transform="translate(600 0) scale(-1 1)"/><path d="M19 134 24 141M19 171 24 178M19 208 24 215M19 245 24 252M19 282 24 289M581 134 576 141M581 171 576 178M581 208 576 215M581 245 576 252M581 282 576 289" stroke="#675020"/></svg>
      </div>
      <div class="theme-machinery" aria-hidden="true">
        <img class="theme-gear theme-gear--large" src="assets/themes/brass-gear-cutout.webp" alt="" />
        <img class="theme-gear theme-gear--small" src="assets/themes/brass-gear-cutout.webp" alt="" />
        <img class="theme-gear theme-gear--lower" src="assets/themes/brass-gear-cutout.webp" alt="" />
      </div>
      <!-- ------------------------------------------------------ main -- -->
      <main id="view-main" class="view view--main">
        <header class="topbar">
          <span class="instrument-brand" aria-hidden="true"><small>TOKUMARU LABS</small><strong>ARCADE COUNTER TIMER</strong></span>
          <span id="run-dot" class="run-dot" aria-hidden="true"></span>
          <div id="clock" class="clock" aria-label="Current time" hidden>
            <span class="clock__label">NOW</span>
            <time id="clock-value" class="clock__value">
              <span id="clock-hour" class="clock__group clock__hour">00</span><span class="clock__separator">:</span><span
                id="clock-minute"
                class="clock__group clock__minute"
              >00</span><span class="clock__separator">:</span><span
                id="clock-second"
                class="clock__group clock__second"
              >00</span>
            </time>
          </div>
          <button id="btn-settings" class="icon-btn" type="button" aria-label="Open statistics and settings">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </header>

        <!-- Click shortcut for the mouse; the labelled buttons below are the
             accessible controls, so this is plain text, not a second button. -->
        <div id="timer" class="timer">
          <span class="bezel-hardware" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="timer-value" class="timer__value">00:00:00</span>
          <span id="timer-state" class="timer__state">STOPPED</span>
        </div>

        <button
          id="btn-start-stop"
          class="mainbtn mainbtn--timer"
          type="button"
          aria-pressed="false"
          aria-label="Start the timer"
        >
          <span id="start-stop-icon" class="mainbtn__icon" aria-hidden="true">&#9654;</span>
          <span id="start-stop-label" class="mainbtn__label">START</span>
        </button>

        <div class="subrow timer-reset-row">
          <button
            id="btn-reset-timer"
            class="hold hold--timer"
            type="button"
            aria-label="Hold for 500 milliseconds to reset the timer only"
          >
            <span class="hold__label">RESET TIMER</span>
          </button>
        </div>

        <div id="count-pad" class="countpad">
          <span class="bezel-hardware" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="count-value" class="countpad__value" role="img" aria-label="0">0</span>
          <span id="fx-layer" class="fx-layer" aria-hidden="true"></span>
        </div>

        <div class="count-actions">
        <button
          id="btn-count"
          class="mainbtn mainbtn--count"
          type="button"
          aria-label="Add one to the count"
        >
          <span class="mainbtn__icon" aria-hidden="true">+</span>
          <span class="mainbtn__label">COUNT</span>
        </button>
        <button id="btn-undo-count" class="undo-count" type="button" aria-label="Undo the last count" title="Undo the last count once. Resets clear undo." disabled>
          <span class="undo-count__icon" aria-hidden="true">↶</span><span>UNDO</span>
        </button>
        </div>

        <div class="subrow count-reset-row">
          <span id="undo-status" class="undo-status" aria-hidden="true"></span>
          <button
            id="btn-reset-count"
            class="hold hold--count"
            type="button"
            aria-label="Hold for 500 milliseconds to reset the count only"
          >
            <span class="hold__label">RESET COUNT</span>
          </button>
        </div>

        <aside id="release-notice" class="release-notice" role="status" aria-live="polite" hidden>
          <div class="release-notice__heading"><span>NEW FEATURE</span><span id="notice-version"></span><button id="notice-close" type="button" aria-label="Dismiss update notice">×</button></div>
          <p id="notice-text"></p>
        </aside>

        <p id="live-region" class="visually-hidden" role="status" aria-live="polite"></p>

        <footer class="footer">
          <p
            class="hints"
            title="ENTER: start or stop the timer. SPACE: add one to the count. Hold R: reset the session."
          >
            ENTER &middot; SPACE &middot; HOLD R
          </p>
          <button
            id="btn-reset"
            class="hold hold--session"
            type="button"
            aria-label="Hold for 650 milliseconds to reset the whole session"
          >
            <span class="hold__label">SESSION RESET</span>
          </button>
        </footer>
      </main>

      <!-- ------------------------------------------------- stats/settings -- -->
      <section id="view-stats" class="view view--stats" hidden aria-label="Statistics and settings">
        <header class="topbar">
          <button id="btn-back" class="icon-btn" type="button" aria-label="Back to timer">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M15 5 8 12l7 7 1.4-1.4L10.8 12l5.6-5.6Z" />
            </svg>
          </button>
          <h1 class="panel-title">STATS</h1>
        </header>

        <table class="stats">
          <thead>
            <tr>
              <th scope="col"><span class="visually-hidden">Period</span></th>
              <th scope="col">TIME</th>
              <th scope="col">COUNT</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">TODAY</th>
              <td id="stat-today-time">00:00:00</td>
              <td id="stat-today-count">0</td>
            </tr>
            <tr>
              <th scope="row">WEEK</th>
              <td id="stat-week-time">00:00:00</td>
              <td id="stat-week-count">0</td>
            </tr>
            <tr>
              <th scope="row">MONTH</th>
              <td id="stat-month-time">00:00:00</td>
              <td id="stat-month-count">0</td>
            </tr>
            <tr>
              <th scope="row">YEAR</th>
              <td id="stat-year-time">00:00:00</td>
              <td id="stat-year-count">0</td>
            </tr>
          </tbody>
        </table>

        <h2 class="panel-title panel-title--sub">SETTINGS</h2>
        <fieldset class="theme-picker">
          <legend>THEME</legend>
          <div class="theme-picker__options">
            <input
              id="theme-space-age"
              class="theme-picker__input"
              type="radio"
              name="theme"
              value="space-age"
              data-theme-option
            />
            <label for="theme-space-age">SPACE AGE</label>
            <input
              id="theme-arcade"
              class="theme-picker__input"
              type="radio"
              name="theme"
              value="arcade"
              data-theme-option
            />
            <label for="theme-arcade">ARCADE</label>
            <input
              id="theme-editorial"
              class="theme-picker__input"
              type="radio"
              name="theme"
              value="editorial"
              data-theme-option
            />
            <label for="theme-editorial">EDITORIAL</label>
            <input id="theme-steampunk" class="theme-picker__input" type="radio" name="theme" value="steampunk" data-theme-option />
            <label for="theme-steampunk">STEAMPUNK</label>
            <input id="theme-art-deco" class="theme-picker__input" type="radio" name="theme" value="art-deco" data-theme-option />
            <label for="theme-art-deco">ART DECO</label>
            <input id="theme-nixie" class="theme-picker__input" type="radio" name="theme" value="nixie" data-theme-option />
            <label for="theme-nixie">NIXIE</label>
          </div>
        </fieldset>
        <fieldset class="display-picker">
          <legend>DISPLAY MODE</legend>
          <select id="display-mode" aria-label="Display mode">
            <option value="popup">POPUP / ポップアップ</option>
            <option value="floating">FLOATING / 自由配置</option>
            <option value="sidepanel">SIDE PANEL / サイドパネル</option>
          </select>
          <button id="btn-open-display" type="button">OPEN SELECTED VIEW</button>
          <p id="display-hint">Your timer and statistics stay with you.</p>
        </fieldset>
        <ul class="settings">
          <li>
            <label for="set-clock">CLOCK</label>
            <input id="set-clock" type="checkbox" data-setting="clock" />
          </li>
          <li>
            <label for="set-sound">SOUND</label>
            <input id="set-sound" type="checkbox" data-setting="sound" />
          </li>
          <li>
            <label for="set-flyText">FLY TEXT</label>
            <input id="set-flyText" type="checkbox" data-setting="flyText" />
          </li>
          <li>
            <label for="set-chainEffect">CHAIN EFFECT</label>
            <input id="set-chainEffect" type="checkbox" data-setting="chainEffect" />
          </li>
          <li>
            <label for="set-subtleCrt">SUBTLE CRT EFFECT</label>
            <input id="set-subtleCrt" type="checkbox" data-setting="subtleCrt" />
          </li>
        </ul>

        <button id="btn-clear" class="danger" type="button" aria-label="Clear all stored data">
          CLEAR ALL DATA
        </button>
        <a class="theme-credits" href="assets/themes/CREDITS.txt" target="_blank" rel="noopener">ARTWORK &amp; FONT CREDITS ↗</a>
      </section>
    </div>

    <p id="app-error" role="alert" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
