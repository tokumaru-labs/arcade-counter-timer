<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arcade Counter Timer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="screen" class="screen">
      <!-- ------------------------------------------------------ main -- -->
      <main id="view-main" class="view view--main">
        <header class="topbar">
          <span id="run-dot" class="run-dot" aria-hidden="true"></span>
          <div id="clock" class="clock" aria-label="Current time" hidden>
            <span class="clock__label">NOW</span>
            <time id="clock-value" class="clock__value">
              <span id="clock-hour" class="clock__group clock__hour">00</span><span class="clock__separator">:</span><span
                id="clock-minute"
                class="clock__group clock__minute"
              >00</span><span class="clock__separator">:</span><span
                id="clock-second"
                class="clock__group clock__second"
              >00</span>
            </time>
          </div>
          <button id="btn-settings" class="icon-btn" type="button" aria-label="Open statistics and settings">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </header>

        <!-- Click shortcut for the mouse; the labelled buttons below are the
             accessible controls, so this is plain text, not a second button. -->
        <div id="timer" class="timer">
          <span id="timer-value" class="timer__value">00:00:00</span>
          <span id="timer-state" class="timer__state">STOPPED</span>
        </div>

        <button
          id="btn-start-stop"
          class="mainbtn mainbtn--timer"
          type="button"
          aria-pressed="false"
          aria-label="Start the timer"
        >
          <span id="start-stop-icon" class="mainbtn__icon" aria-hidden="true">&#9654;</span>
          <span id="start-stop-label" class="mainbtn__label">START</span>
        </button>

        <div class="subrow">
          <button
            id="btn-reset-timer"
            class="hold hold--timer"
            type="button"
            aria-label="Hold for 500 milliseconds to reset the timer only"
          >
            <span class="hold__label">RESET TIMER</span>
          </button>
        </div>

        <div id="count-pad" class="countpad">
          <span id="count-value" class="countpad__value">0</span>
          <span id="fx-layer" class="fx-layer" aria-hidden="true"></span>
        </div>

        <button
          id="btn-count"
          class="mainbtn mainbtn--count"
          type="button"
          aria-label="Add one to the count"
        >
          <span class="mainbtn__icon" aria-hidden="true">+</span>
          <span class="mainbtn__label">COUNT</span>
        </button>

        <div class="subrow">
          <button
            id="btn-reset-count"
            class="hold hold--count"
            type="button"
            aria-label="Hold for 500 milliseconds to reset the count only"
          >
            <span class="hold__label">RESET COUNT</span>
          </button>
        </div>

        <p id="live-region" class="visually-hidden" role="status" aria-live="polite"></p>

        <footer class="footer">
          <p
            class="hints"
            title="ENTER: start or stop the timer. SPACE: add one to the count. Hold R: reset the session."
          >
            ENTER &middot; SPACE &middot; HOLD R
          </p>
          <button
            id="btn-reset"
            class="hold hold--session"
            type="button"
            aria-label="Hold for 650 milliseconds to reset the whole session"
          >
            <span class="hold__label">SESSION RESET</span>
          </button>
        </footer>
      </main>

      <!-- ------------------------------------------------- stats/settings -- -->
      <section id="view-stats" class="view view--stats" hidden aria-label="Statistics and settings">
        <header class="topbar">
          <button id="btn-back" class="icon-btn" type="button" aria-label="Back to timer">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M15 5 8 12l7 7 1.4-1.4L10.8 12l5.6-5.6Z" />
            </svg>
          </button>
          <h1 class="panel-title">STATS</h1>
        </header>

        <table class="stats">
          <thead>
            <tr>
              <th scope="col"><span class="visually-hidden">Period</span></th>
              <th scope="col">TIME</th>
              <th scope="col">COUNT</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">TODAY</th>
              <td id="stat-today-time">00:00:00</td>
              <td id="stat-today-count">0</td>
            </tr>
            <tr>
              <th scope="row">WEEK</th>
              <td id="stat-week-time">00:00:00</td>
              <td id="stat-week-count">0</td>
            </tr>
            <tr>
              <th scope="row">MONTH</th>
              <td id="stat-month-time">00:00:00</td>
              <td id="stat-month-count">0</td>
            </tr>
            <tr>
              <th scope="row">YEAR</th>
              <td id="stat-year-time">00:00:00</td>
              <td id="stat-year-count">0</td>
            </tr>
          </tbody>
        </table>

        <h2 class="panel-title panel-title--sub">SETTINGS</h2>
        <fieldset class="theme-picker">
          <legend>THEME</legend>
          <div class="theme-picker__options">
            <input
              id="theme-original"
              class="theme-picker__input"
              type="radio"
              name="theme"
              value="original"
              data-theme-option
            />
            <label for="theme-original">ORIGINAL</label>
            <input
              id="theme-arcade"
              class="theme-picker__input"
              type="radio"
              name="theme"
              value="arcade"
              data-theme-option
            />
            <label for="theme-arcade">ARCADE</label>
            <input
              id="theme-editorial"
              class="theme-picker__input"
              type="radio"
              name="theme"
              value="editorial"
              data-theme-option
            />
            <label for="theme-editorial">EDITORIAL</label>
          </div>
        </fieldset>
        <ul class="settings">
          <li>
            <label for="set-clock">CLOCK</label>
            <input id="set-clock" type="checkbox" data-setting="clock" />
          </li>
          <li>
            <label for="set-sound">SOUND</label>
            <input id="set-sound" type="checkbox" data-setting="sound" />
          </li>
          <li>
            <label for="set-flyText">FLY TEXT</label>
            <input id="set-flyText" type="checkbox" data-setting="flyText" />
          </li>
          <li>
            <label for="set-chainEffect">CHAIN EFFECT</label>
            <input id="set-chainEffect" type="checkbox" data-setting="chainEffect" />
          </li>
          <li>
            <label for="set-subtleCrt">SUBTLE CRT EFFECT</label>
            <input id="set-subtleCrt" type="checkbox" data-setting="subtleCrt" />
          </li>
        </ul>

        <button id="btn-clear" class="danger" type="button" aria-label="Clear all stored data">
          CLEAR ALL DATA
        </button>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
